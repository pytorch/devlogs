<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" role="img" aria-labelledby="title description">
  <title id="title">Tensor-parallel MLP forward and backward types</title>
  <desc id="description">Comparison of forward and backward SPMD types and collectives for a tensor-parallel MLP with sequence parallelism enabled and disabled.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="panel-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="panel-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="collective-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#94a3b8"/>
      <stop offset="0.88" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dx="0" dy="5" result="offsetBlur"/>
      <feFlood flood-color="#0f172a" flood-opacity="0.14" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadowBlur"/>
      <feMerge>
        <feMergeNode in="shadowBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1478cf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e83232"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: -0.5px; }
      .subtitle { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; letter-spacing: 1.6px; }
      .label { font: 650 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .small { font: 650 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .box { fill: url(#card); stroke: #334155; stroke-width: 2.5; filter: url(#shadow); }
      .split { stroke: #94a3b8; stroke-width: 2; }
      .collective { fill: url(#collective-fill); stroke: #16a34a; stroke-width: 2.5; filter: url(#shadow); }
      .forward { fill: #0875d1; }
      .backward { fill: #e52f37; }
      .fwd-line { fill: none; stroke: #1681d8; stroke-width: 3.5; stroke-linecap: round; marker-end: url(#arrow-blue); }
      .bwd-line { fill: none; stroke: #ef3340; stroke-width: 3.5; stroke-linecap: round; marker-end: url(#arrow-red); }
      .panel { stroke-width: 1.5; }
      .legend { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1800" height="1000" fill="url(#background)"/>
  <rect class="panel" x="18" y="16" width="835" height="968" rx="30" fill="url(#panel-left)" stroke="#bfdbfe"/>
  <rect class="panel" x="947" y="16" width="835" height="968" rx="30" fill="url(#panel-right)" stroke="#fed7aa"/>
  <text class="title" x="390" y="54" text-anchor="middle">SP=on</text>
  <text class="subtitle" x="390" y="82" text-anchor="middle">SEQUENCE-SHARDED BOUNDARIES</text>
  <text class="title" x="1410" y="54" text-anchor="middle">SP=off</text>
  <text class="subtitle" x="1410" y="82" text-anchor="middle">REPLICATED BOUNDARIES</text>
  <line x1="900" y1="76" x2="900" y2="970" stroke="url(#divider)" stroke-width="3"/>

  <rect class="legend" x="834" y="18" width="132" height="106" rx="18"/>
  <circle cx="858" cy="54" r="7" fill="#1478cf"/>
  <text class="small forward" x="876" y="60">FWD</text>
  <circle cx="858" cy="91" r="7" fill="#e83232"/>
  <text class="small backward" x="876" y="97">BWD</text>

  <!-- Sequence parallelism enabled. -->
  <rect class="box" x="80" y="110" width="330" height="70" rx="14"/>
  <line class="split" x1="245" y1="110" x2="245" y2="180"/>
  <text class="label forward" x="162" y="153" text-anchor="middle">x: S(1)</text>
  <text class="label backward" x="328" y="153" text-anchor="middle">grad_x: S(1)</text>

  <path class="fwd-line" d="M 163 188 L 163 240"/>
  <text class="small forward" x="111" y="221">S(1)</text>
  <path class="bwd-line" d="M 327 240 L 327 188"/>
  <text class="small backward" x="341" y="221">S(1)</text>

  <rect class="collective" x="55" y="250" width="380" height="50" rx="10"/>
  <line class="split" x1="245" y1="250" x2="245" y2="300"/>
  <text class="label forward" x="150" y="282" text-anchor="middle">all-gather</text>
  <text class="label backward" x="340" y="282" text-anchor="middle">reduce-scatter</text>

  <path class="fwd-line" d="M 163 308 L 163 360"/>
  <text class="small forward" x="132" y="342">R</text>
  <path class="bwd-line" d="M 327 360 L 327 308"/>
  <text class="small backward" x="341" y="342">P</text>

  <rect class="box" x="80" y="370" width="530" height="70" rx="14"/>
  <line class="split" x1="245" y1="370" x2="245" y2="440"/>
  <text class="label forward" x="162" y="413" text-anchor="middle">x @ w1</text>
  <text class="small backward" x="428" y="413" text-anchor="middle">grad_h @ w1.T; x.T @ grad_h</text>

  <rect class="box" x="660" y="345" width="180" height="110" rx="18"/>
  <line class="split" x1="660" y1="400" x2="840" y2="400"/>
  <text class="small forward" x="750" y="380" text-anchor="middle">w1: S(1)</text>
  <text class="small backward" x="750" y="435" text-anchor="middle">grad_w1: S(1)</text>
  <path class="fwd-line" d="M 650 382 L 618 382"/>
  <text class="small forward" x="634" y="365" text-anchor="middle">S(1)</text>
  <path class="bwd-line" d="M 618 425 L 650 425"/>
  <text class="small backward" x="634" y="450" text-anchor="middle">S(1)</text>

  <path class="fwd-line" d="M 163 448 L 163 495"/>
  <text class="small forward" x="112" y="480">S(1)</text>
  <path class="bwd-line" d="M 327 495 L 327 448"/>
  <text class="small backward" x="341" y="480">S(1)</text>

  <rect class="box" x="125" y="505" width="260" height="70" rx="14"/>
  <line class="split" x1="255" y1="505" x2="255" y2="575"/>
  <text class="label forward" x="190" y="548" text-anchor="middle">silu</text>
  <text class="label backward" x="320" y="548" text-anchor="middle">silu_bwd</text>

  <path class="fwd-line" d="M 163 583 L 163 635"/>
  <text class="small forward" x="112" y="618">S(1)</text>
  <path class="bwd-line" d="M 327 635 L 327 583"/>
  <text class="small backward" x="341" y="618">S(1)</text>

  <rect class="box" x="80" y="645" width="555" height="70" rx="14"/>
  <line class="split" x1="250" y1="645" x2="250" y2="715"/>
  <text class="label forward" x="165" y="688" text-anchor="middle">h @ w2</text>
  <text class="small backward" x="443" y="688" text-anchor="middle">grad_out @ w2.T; h.T @ grad_out</text>

  <rect class="box" x="680" y="620" width="180" height="110" rx="18"/>
  <line class="split" x1="680" y1="675" x2="860" y2="675"/>
  <text class="small forward" x="770" y="655" text-anchor="middle">w2: S(0)</text>
  <text class="small backward" x="770" y="710" text-anchor="middle">grad_w2: S(0)</text>
  <path class="fwd-line" d="M 670 657 L 643 657"/>
  <text class="small forward" x="655" y="640" text-anchor="middle">S(0)</text>
  <path class="bwd-line" d="M 643 700 L 670 700"/>
  <text class="small backward" x="655" y="725" text-anchor="middle">S(0)</text>

  <path class="fwd-line" d="M 163 723 L 163 800"/>
  <text class="small forward" x="100" y="765">P(sum)</text>
  <path class="bwd-line" d="M 337 800 L 337 723"/>
  <text class="small backward" x="351" y="765">R</text>

  <rect class="collective" x="60" y="810" width="390" height="50" rx="10"/>
  <line class="split" x1="255" y1="810" x2="255" y2="860"/>
  <text class="label forward" x="157" y="842" text-anchor="middle">reduce-scatter</text>
  <text class="label backward" x="353" y="842" text-anchor="middle">all-gather</text>

  <path class="fwd-line" d="M 163 868 L 163 900"/>
  <text class="small forward" x="112" y="895">S(1)</text>
  <path class="bwd-line" d="M 337 900 L 337 868"/>
  <text class="small backward" x="351" y="895">S(1)</text>

  <rect class="box" x="80" y="910" width="350" height="70" rx="14"/>
  <line class="split" x1="255" y1="910" x2="255" y2="980"/>
  <text class="label forward" x="168" y="953" text-anchor="middle">out: S(1)</text>
  <text class="label backward" x="343" y="953" text-anchor="middle">grad_out: S(1)</text>

  <!-- Sequence parallelism disabled. -->
  <rect class="box" x="1030" y="110" width="330" height="70" rx="14"/>
  <line class="split" x1="1195" y1="110" x2="1195" y2="180"/>
  <text class="label forward" x="1112" y="153" text-anchor="middle">x: I</text>
  <text class="label backward" x="1278" y="153" text-anchor="middle">grad_x: I</text>

  <path class="fwd-line" d="M 1113 188 L 1113 240"/>
  <text class="small forward" x="1080" y="221">I</text>
  <path class="bwd-line" d="M 1277 240 L 1277 188"/>
  <text class="small backward" x="1291" y="221">I</text>

  <rect class="collective" x="1005" y="250" width="380" height="50" rx="10"/>
  <line class="split" x1="1195" y1="250" x2="1195" y2="300"/>
  <text class="label forward" x="1100" y="282" text-anchor="middle">no-op</text>
  <text class="label backward" x="1290" y="282" text-anchor="middle">all-reduce</text>

  <path class="fwd-line" d="M 1113 308 L 1113 360"/>
  <text class="small forward" x="1080" y="342">R</text>
  <path class="bwd-line" d="M 1277 360 L 1277 308"/>
  <text class="small backward" x="1291" y="342">P</text>

  <rect class="box" x="1030" y="370" width="530" height="70" rx="14"/>
  <line class="split" x1="1195" y1="370" x2="1195" y2="440"/>
  <text class="label forward" x="1112" y="413" text-anchor="middle">x @ w1</text>
  <text class="small backward" x="1378" y="413" text-anchor="middle">grad_h @ w1.T; x.T @ grad_h</text>

  <rect class="box" x="1610" y="345" width="180" height="110" rx="18"/>
  <line class="split" x1="1610" y1="400" x2="1790" y2="400"/>
  <text class="small forward" x="1700" y="380" text-anchor="middle">w1: S(1)</text>
  <text class="small backward" x="1700" y="435" text-anchor="middle">grad_w1: S(1)</text>
  <path class="fwd-line" d="M 1600 382 L 1568 382"/>
  <text class="small forward" x="1584" y="365" text-anchor="middle">S(1)</text>
  <path class="bwd-line" d="M 1568 425 L 1600 425"/>
  <text class="small backward" x="1584" y="450" text-anchor="middle">S(1)</text>

  <path class="fwd-line" d="M 1113 448 L 1113 495"/>
  <text class="small forward" x="1062" y="480">S(1)</text>
  <path class="bwd-line" d="M 1277 495 L 1277 448"/>
  <text class="small backward" x="1291" y="480">S(1)</text>

  <rect class="box" x="1075" y="505" width="260" height="70" rx="14"/>
  <line class="split" x1="1205" y1="505" x2="1205" y2="575"/>
  <text class="label forward" x="1140" y="548" text-anchor="middle">silu</text>
  <text class="label backward" x="1270" y="548" text-anchor="middle">silu_bwd</text>

  <path class="fwd-line" d="M 1113 583 L 1113 635"/>
  <text class="small forward" x="1062" y="618">S(1)</text>
  <path class="bwd-line" d="M 1277 635 L 1277 583"/>
  <text class="small backward" x="1291" y="618">S(1)</text>

  <rect class="box" x="1030" y="645" width="555" height="70" rx="14"/>
  <line class="split" x1="1200" y1="645" x2="1200" y2="715"/>
  <text class="label forward" x="1115" y="688" text-anchor="middle">h @ w2</text>
  <text class="small backward" x="1393" y="688" text-anchor="middle">grad_out @ w2.T; h.T @ grad_out</text>

  <rect class="box" x="1630" y="620" width="160" height="110" rx="18"/>
  <line class="split" x1="1630" y1="675" x2="1790" y2="675"/>
  <text class="small forward" x="1710" y="655" text-anchor="middle">w2: S(0)</text>
  <text class="small backward" x="1710" y="710" text-anchor="middle">grad_w2: S(0)</text>
  <path class="fwd-line" d="M 1620 657 L 1593 657"/>
  <text class="small forward" x="1605" y="640" text-anchor="middle">S(0)</text>
  <path class="bwd-line" d="M 1593 700 L 1620 700"/>
  <text class="small backward" x="1605" y="725" text-anchor="middle">S(0)</text>

  <path class="fwd-line" d="M 1113 723 L 1113 800"/>
  <text class="small forward" x="1050" y="765">P(sum)</text>
  <path class="bwd-line" d="M 1287 800 L 1287 723"/>
  <text class="small backward" x="1301" y="765">R</text>

  <rect class="collective" x="1010" y="810" width="390" height="50" rx="10"/>
  <line class="split" x1="1205" y1="810" x2="1205" y2="860"/>
  <text class="label forward" x="1107" y="842" text-anchor="middle">all-reduce</text>
  <text class="label backward" x="1303" y="842" text-anchor="middle">no-op</text>

  <path class="fwd-line" d="M 1113 868 L 1113 900"/>
  <text class="small forward" x="1080" y="895">I</text>
  <path class="bwd-line" d="M 1287 900 L 1287 868"/>
  <text class="small backward" x="1301" y="895">I</text>

  <rect class="box" x="1030" y="910" width="350" height="70" rx="14"/>
  <line class="split" x1="1205" y1="910" x2="1205" y2="980"/>
  <text class="label forward" x="1118" y="953" text-anchor="middle">out: I</text>
  <text class="label backward" x="1293" y="953" text-anchor="middle">grad_out: I</text>
</svg>
