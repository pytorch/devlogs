.ink{fill:#cccccc}
.muted{fill:#8a8a8a}
.bad-t{fill:#e66767}
.sep{stroke:#3a3a3a}
.arrow{stroke:#8a8a8a}
.arrowhead{fill:#8a8a8a}
.wait{stroke:#8a8a8a;fill:none}
.bad{stroke:#e66767;fill:url(#hatch-bad)}
.hatch-bad-l{stroke:#e66767}
.span{stroke:#cccccc}
.evt{fill:#cccccc}
.fA{fill:#3987e5;fill-opacity:.22;stroke:#3987e5}
.hA{fill:url(#hatch-A);stroke:#3987e5;stroke-dasharray:4 3}
.hlA{stroke:#3987e5}
.fB{fill:#d95926;fill-opacity:.22;stroke:#d95926}
.hB{fill:url(#hatch-B);stroke:#d95926;stroke-dasharray:4 3}
.hlB{stroke:#d95926}
.fC{fill:#199e70;fill-opacity:.22;stroke:#199e70}
.hC{fill:url(#hatch-C);stroke:#199e70;stroke-dasharray:4 3}
.hlC{stroke:#199e70}
.fD{fill:#9085e9;fill-opacity:.22;stroke:#9085e9}
.hD{fill:url(#hatch-D);stroke:#9085e9;stroke-dasharray:4 3}
.hlD{stroke:#9085e9}
.fN{fill:#9a9a9a;fill-opacity:.22;stroke:#9a9a9a}
.hN{fill:url(#hatch-N);stroke:#9a9a9a;stroke-dasharray:4 3}
.hlN{stroke:#9a9a9a}
}</style>
<defs>
<pattern id="hatch-A" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hlA" x1="0" y1="0" x2="0" y2="7" stroke-width="2" stroke-opacity=".55"/></pattern>
<pattern id="hatch-B" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hlB" x1="0" y1="0" x2="0" y2="7" stroke-width="2" stroke-opacity=".55"/></pattern>
<pattern id="hatch-C" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hlC" x1="0" y1="0" x2="0" y2="7" stroke-width="2" stroke-opacity=".55"/></pattern>
<pattern id="hatch-D" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hlD" x1="0" y1="0" x2="0" y2="7" stroke-width="2" stroke-opacity=".55"/></pattern>
<pattern id="hatch-N" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hlN" x1="0" y1="0" x2="0" y2="7" stroke-width="2" stroke-opacity=".55"/></pattern>
<pattern id="hatch-bad" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-bad-l" x1="0" y1="0" x2="0" y2="7" stroke-width="2" stroke-opacity=".55"/></pattern>
</defs>
<text class="ink" x="136.0" y="57.5" text-anchor="end" font-weight="600">AG stream</text>
<text class="ink" x="136.0" y="91.5" text-anchor="end" font-weight="600">compute stream</text>
<text class="muted" x="136.0" y="145.9" text-anchor="end">block A</text>
<line class="sep" x1="12" y1="114.2" x2="848" y2="114.2"/>
<rect class="box fA" x="151.0" y="41.0" width="90.0" height="24" rx="4"/>
<text class="ink" x="196.0" y="57.5" text-anchor="middle">AG L1</text>
<rect class="box fA" x="243.0" y="41.0" width="90.0" height="24" rx="4"/>
<text class="ink" x="288.0" y="57.5" text-anchor="middle">AG L2</text>
<rect class="box fA" x="335.0" y="41.0" width="90.0" height="24" rx="4"/>
<text class="ink" x="380.0" y="57.5" text-anchor="middle">AG L3</text>
<rect class="box fA" x="427.0" y="41.0" width="90.0" height="24" rx="4"/>
<text class="ink" x="472.0" y="57.5" text-anchor="middle">AG L4</text>
<rect class="box fA" x="243.0" y="75.0" width="320.0" height="24" rx="4"/>
<text class="ink" x="403.0" y="91.5" text-anchor="middle">fwd L1 (reads A)</text>
<rect class="box fA" x="151.0" y="129.4" width="90.0" height="24" rx="4"/>
<text class="ink" x="196.0" y="145.9" text-anchor="middle">L1 params</text>
<rect class="box fA" x="243.0" y="129.4" width="90.0" height="24" rx="4"/>
<text class="ink" x="288.0" y="145.9" text-anchor="middle">L2 params</text>
<rect class="box fA" x="335.0" y="129.4" width="90.0" height="24" rx="4"/>
<text class="ink" x="380.0" y="145.9" text-anchor="middle">L3 params</text>
<rect class="box fA" x="427.0" y="129.4" width="90.0" height="24" rx="4"/>
<text class="ink" x="472.0" y="145.9" text-anchor="middle">L4 params</text>
<path class="arrow" d="M242.0,65.0 C242.0,69.5 242.0,69.5 242.0,70.0"/>
<path class="arrowhead" d="M237.5,67.0 L246.5,67.0 L242.0,74.0 Z"/>
<rect class="bad" x="243.0" y="72.0" width="274.0" height="30" rx="5"/>
<rect class="bad" x="243.0" y="38.0" width="274.0" height="30" rx="5"/>
<text class="bad-t" x="529.5" y="57.5" text-anchor="start">AG L2-L4 all reuse and overwrite block A</text>
<text class="bad-t" x="575.5" y="91.5" text-anchor="start">fwd L1 reads other layers&#x27; values</text>
<text class="muted" x="529.5" y="145.9" text-anchor="start">each freed as soon as its fwd is enqueued</text>
<path class="evt" d="M242.0,28.5 L247.5,34.0 L242.0,39.5 L236.5,34.0 Z"/>
<text class="ink mono" x="242.0" y="25.0" text-anchor="middle">del L1</text>
</svg>