<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 222" width="1010" height="222" role="img" aria-label="FSDP2 forward: copy-in, all-gather and copy-out on three streams; the copy-out event of L1 gates reuse of L1&#x27;s all-gather buffer">
<title>FSDP2 forward: copy-in, all-gather and copy-out on three streams; the copy-out event of L1 gates reuse of L1&#x27;s all-gather buffer</title>
<style>
