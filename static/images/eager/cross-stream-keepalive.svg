<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 210" width="722" height="210" role="img" aria-label="Keepalive: holding the L1 reference makes AG L2 use a second block; the AG stream waits on fwd_done only right before block A is reused">
<title>Keepalive: holding the L1 reference makes AG L2 use a second block; the AG stream waits on fwd_done only right before block A is reused</title>
<style>
