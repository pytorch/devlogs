<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 154" width="904" height="154" role="img" aria-label="FSDP2 backward with one reduce-scatter input buffer: the compute stream waits for RS L4 before copying L3&#x27;s gradients into the same block">
