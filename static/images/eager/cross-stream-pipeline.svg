<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 100" width="722" height="100" role="img" aria-label="Producer-consumer pipeline: all-gathers on the AG stream run ahead of forward compute on the compute stream">
<title>Producer-consumer pipeline: all-gathers on the AG stream run ahead of forward compute on the compute stream</title>
<style>
text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.mono{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.lane{font-weight:600}
.box{stroke-width:1.5}
.sep{stroke-width:1}
.arrow{stroke-width:1.5;fill:none}
.wait{stroke-width:1.2;stroke-dasharray:4 3}
