.arrowhead{fill:#8a8a8a}
.wait{stroke:#8a8a8a;fill:none}
.bad{stroke:#e66767;fill:url(#hatch-bad)}
.hatch-bad-l{stroke:#e66767}
.span{stroke:#cccccc}
.evt{fill:#cccccc}
.fA{fill:#3987e5;fill-opacity:.22;stroke:#3987e5}
.hA{fill:url(#hatch-A);stroke:#3987e5;stroke-dasharray:4 3}
.hlA{stroke:#3987e5}
.fB{fill:#d95926;fill-opacity:.22;stroke:#d95926}
.hB{fill:url(#hatch-B);stroke:#d95926;stroke-dasharray:4 3}
.hlB{stroke:#d95926}
.fC{fill:#199e70;fill-opacity:.22;stroke:#199e70}
.hC{fill:url(#hatch-C);stroke:#199e70;stroke-dasharray:4 3}
.hlC{stroke:#199e70}
.fD{fill:#9085e9;fill-opacity:.22;stroke:#9085e9}
.hD{fill:url(#hatch-D);stroke:#9085e9;stroke-dasharray:4 3}
.hlD{stroke:#9085e9}
.fN{fill:#9a9a9a;fill-opacity:.22;stroke:#9a9a9a}
.hN{fill:url(#hatch-N);stroke:#9a9a9a;stroke-dasharray:4 3}
.hlN{stroke:#9a9a9a}
}</style>
<defs>
<pattern id="hatch-A" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hlA" x1="0" y1="0" x2="0" y2="7" stroke-width="2" stroke-opacity=".55"/></pattern>
<pattern id="hatch-B" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hlB" x1="0" y1="0" x2="0" y2="7" stroke-width="2" stroke-opacity=".55"/></pattern>
<pattern id="hatch-C" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hlC" x1="0" y1="0" x2="0" y2="7" stroke-width="2" stroke-opacity=".55"/></pattern>
<pattern id="hatch-D" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hlD" x1="0" y1="0" x2="0" y2="7" stroke-width="2" stroke-opacity=".55"/></pattern>
<pattern id="hatch-N" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hlN" x1="0" y1="0" x2="0" y2="7" stroke-width="2" stroke-opacity=".55"/></pattern>
<pattern id="hatch-bad" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-bad-l" x1="0" y1="0" x2="0" y2="7" stroke-width="2" stroke-opacity=".55"/></pattern>
</defs>
