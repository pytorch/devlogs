<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 172" width="860" height="172" role="img" aria-label="Bug: after del L1 the allocator hands block A to AG L2, then AG L3 and AG L4, while fwd L1 is still reading it">
<title>Bug: after del L1 the allocator hands block A to AG L2, then AG L3 and AG L4, while fwd L1 is still reading it</title>
<style>
text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.mono{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.lane{font-weight:600}
.box{stroke-width:1.5}
.sep{stroke-width:1}
.arrow{stroke-width:1.5;fill:none}
.wait{stroke-width:1.2;stroke-dasharray:4 3}
.bad{stroke-width:2}
.span{stroke-width:1.2;fill:none}
.ink{fill:#333333}
.muted{fill:#767676}
.bad-t{fill:#e34948}
.sep{stroke:#e0e0e0}
.arrow{stroke:#767676}
.arrowhead{fill:#767676}
.wait{stroke:#767676;fill:none}
.bad{stroke:#e34948;fill:url(#hatch-bad)}
.hatch-bad-l{stroke:#e34948}
.span{stroke:#333333}
.evt{fill:#333333}
.fA{fill:#2a78d6;fill-opacity:.22;stroke:#2a78d6}
.hA{fill:url(#hatch-A);stroke:#2a78d6;stroke-dasharray:4 3}
.hlA{stroke:#2a78d6}
.fB{fill:#eb6834;fill-opacity:.22;stroke:#eb6834}
.hB{fill:url(#hatch-B);stroke:#eb6834;stroke-dasharray:4 3}
.hlB{stroke:#eb6834}
.fC{fill:#1baf7a;fill-opacity:.22;stroke:#1baf7a}
.hC{fill:url(#hatch-C);stroke:#1baf7a;stroke-dasharray:4 3}
.hlC{stroke:#1baf7a}
.fD{fill:#4a3aa7;fill-opacity:.22;stroke:#4a3aa7}
.hD{fill:url(#hatch-D);stroke:#4a3aa7;stroke-dasharray:4 3}
.hlD{stroke:#4a3aa7}
.fN{fill:#8a8a8a;fill-opacity:.22;stroke:#8a8a8a}
.hN{fill:url(#hatch-N);stroke:#8a8a8a;stroke-dasharray:4 3}
.hlN{stroke:#8a8a8a}
