<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 154" width="800" height="154" role="img" aria-label="Stall: the AG stream waits for each forward before reusing the single block, so all-gather and forward are serialized">
<title>Stall: the AG stream waits for each forward before reusing the single block, so all-gather and forward are serialized</title>
<style>
text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.mono{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.lane{font-weight:600}
.box{stroke-width:1.5}
.sep{stroke-width:1}
.arrow{stroke-width:1.5;fill:none}
.wait{stroke-width:1.2;stroke-dasharray:4 3}
